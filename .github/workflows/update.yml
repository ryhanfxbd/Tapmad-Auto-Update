
name: Tapmad Playlist Auto Update

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tapmad-playlist-update
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest playlist and JSON
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL --retry 3 \
            "https://gist.githubusercontent.com/albatr0ssss/3cff7a26be49b1d352c15f615067e7cd/raw/tapmad_bd.m3u" \
            -o tapmad_bd.m3u

          curl -fsSL --retry 3 \
            "https://gist.githubusercontent.com/albatr0ssss/3cff7a26be49b1d352c15f615067e7cd/raw/tapmad_bd.json" \
            -o tapmad_bd.json

          test -s tapmad_bd.m3u
          test -s tapmad_bd.json

      - name: Validate JSON
        run: python -m json.tool tapmad_bd.json > /dev/null

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add tapmad_bd.m3u tapmad_bd.json

          if ! git diff --cached --quiet; then
            git commit -m "Auto-update Tapmad playlist"
            git push
          else
            echo "No changes detected."
          fi


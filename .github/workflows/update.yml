
name: Tapmad Auto Update V2

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tapmad-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Latest Sources
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p temp

          curl -fLsS --retry 3 --max-time 120 \
            "https://gist.githubusercontent.com/albatr0ssss/3cff7a26be49b1d352c15f615067e7cd/raw/tapmad_bd.m3u" \
            -o temp/tapmad_bd.m3u

          curl -fLsS --retry 3 --max-time 120 \
            "https://gist.githubusercontent.com/albatr0ssss/3cff7a26be49b1d352c15f615067e7cd/raw/tapmad_bd.json" \
            -o temp/tapmad_bd.json

      - name: Validate Playlist and JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          m3u = Path("temp/tapmad_bd.m3u").read_text()
          lines = [x.strip() for x in m3u.splitlines() if x.strip()]

          assert "#EXTM3U" in lines, "Invalid M3U header"
          assert any(x.startswith("#EXTINF:") for x in lines), "No entries"
          assert any(x.startswith("http") for x in lines), "No stream URLs"

          data = json.loads(
              Path("temp/tapmad_bd.json").read_text()
          )

          assert isinstance(data.get("Matches"), list)
          assert len(data["Matches"]) > 0

          for match in data["Matches"]:
              assert match.get("EntityId") is not None
              assert match.get("VideoName")
              assert match.get("Status")

          stats = data.get("Stats", {})
          statuses = [m["Status"] for m in data["Matches"]]

          if "LiveCount" in stats:
              assert stats["LiveCount"] == statuses.count("Live")

          if "UpcomingCount" in stats:
              assert stats["UpcomingCount"] == statuses.count("Upcoming")

          print("M3U validation: SUCCESS")
          print("JSON validation: SUCCESS")
          print("Matches:", len(data["Matches"]))
          PY

      - name: Publish Validated Files
        run: |
          cp temp/tapmad_bd.m3u tapmad_bd.m3u
          cp temp/tapmad_bd.json tapmad_bd.json

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add tapmad_bd.m3u tapmad_bd.json

          if ! git diff --cached --quiet; then
            git commit -m "V2: Automated Tapmad update"
            git push
          else
            echo "No changes detected"
          fi
